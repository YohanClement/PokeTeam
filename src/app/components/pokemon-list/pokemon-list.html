<div class="pokemon-container pokedex-box">
    <h1></h1>

    <div class="pokemon-grid pokedex-screen">
        @for (pokemon of pokemons(); track pokemon.name) {
        <a class="pokemon-card" [routerLink]="['/pokemon', pokemon.name]">
            <img [src]="pokemon.imageUrl" [alt]="pokemon.name" loading="lazy">
        </a>
        }
    </div>

    @if (pokemons().length === 0) {
    <p>Chargement des Pokémon...</p>
    }
</div>
